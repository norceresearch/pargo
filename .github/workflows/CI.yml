name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests_frozen:
    name: Tests (frozen)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest

  tests_matrix:
    name: Tests
    runs-on: ${{ matrix.os }}
    needs: tests_frozen
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.11"
          python-version: ${{ matrix.python-version }}

      - name: Install package with uv
        run: uv sync --upgrade

      - name: Run tests
        run: uv run pytest

  integration:
    name: Integration (Argo on kind)
    runs-on: ubuntu-latest
    needs: tests_frozen
    timeout-minutes: 20
    env:
      ARGO_VERSION: v4.1.2
      # Drives both the generated manifests and kubectl below. `default` is the
      # service account argo's quick-start already grants the workflow roles to.
      PARGO_NAMESPACE: argo
      PARGO_SERVICE_ACCOUNT: default

    steps:
      - uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pargo

      - name: Build and load pargo image
        run: |
          docker build -t pargo:test .
          kind load docker-image pargo:test --name pargo

      - name: Install Argo Workflows
        run: |
          kubectl create namespace "$PARGO_NAMESPACE"
          kubectl apply -n "$PARGO_NAMESPACE" -f "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/quick-start-minimal.yaml"
          kubectl wait --for=condition=Available --timeout=300s -n "$PARGO_NAMESPACE" deployment --all

      - name: Install argo CLI
        run: |
          curl -sSL -o /tmp/argo.gz "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz"
          gunzip -f /tmp/argo.gz
          chmod +x /tmp/argo
          sudo mv /tmp/argo /usr/local/bin/argo

      - name: Run integration tests
        env:
          PARGO_INTEGRATION: "1"
        run: uv run pytest tests/test_integration.py -v

      - name: Dump workflow state on failure
        if: failure()
        run: kubectl get workflows,pods -n "$PARGO_NAMESPACE" -o wide

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build docs with pdoc
        run: uv run pdoc pargo -o docs --no-search

      - name: Upload docs
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  pages:
    name: Deploy pages
    needs: docs
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
